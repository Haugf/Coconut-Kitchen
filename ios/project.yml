# XcodeGen spec for the Coconut Kitchen iPhone app and widgets.
#   brew install xcodegen && cd ios && xcodegen
# then open CoconutKitchen.xcodeproj. The .xcodeproj is generated, not committed.
name: CoconutKitchen
options:
  bundleIdPrefix: com.haugf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Set your Apple team here, or pick it once under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CoconutKitchen:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
    dependencies:
      - target: MirrorWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haugf.coconutkitchen
        PRODUCT_NAME: Coconut Kitchen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: App/CoconutKitchen.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.haugf.coconutkitchen
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coconut Kitchen
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # The Pi speaks plain HTTP on the home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Coconut Kitchen talks to the mirror on your home Wi-Fi to show today and send it messages.
        CFBundleURLTypes:
          - CFBundleURLName: com.haugf.coconutkitchen
            CFBundleURLSchemes:
              - coconutkitchen

  MirrorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haugf.coconutkitchen.widgets
        PRODUCT_NAME: MirrorWidgets
    entitlements:
      path: Widgets/MirrorWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.haugf.coconutkitchen
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Coconut Kitchen
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
